# =========================================================
# 고용훈 Backend Developer Portfolio
# =========================================================

theme: jekyll-theme-chirpy

# ---------------------------------------------------------
# Language & Timezone
# ---------------------------------------------------------

lang: ko-KR
timezone: Asia/Seoul

# ---------------------------------------------------------
# Site Information
# ---------------------------------------------------------

title: 고용훈
tagline: Backend Developer

description: >-
  Java와 Spring Boot를 중심으로 백엔드 시스템을 개발합니다.
  로그와 실행 계획을 기반으로 문제의 원인을 분석하고,
  성능과 구조를 개선하는 과정을 기록합니다.

url: "https://yonghuun.github.io"
baseurl: ""

# ---------------------------------------------------------
# GitHub & Social
# ---------------------------------------------------------

github:
  username: yonghuun

social:
  name: 고용훈

  # 실제 공개할 이메일이 정해지면 다음 줄의 주석을 해제해 입력하세요.
  # email: name@example.com

  links:
    - https://github.com/yonghuun


# ---------------------------------------------------------
# Search Engine Verification
# ---------------------------------------------------------

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ---------------------------------------------------------
# Analytics
# ---------------------------------------------------------

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# ---------------------------------------------------------
# Appearance
# ---------------------------------------------------------

# 기본 화면을 다크 모드로 시작
theme_mode: dark

cdn:

# 프로필 이미지를 등록한 뒤 경로 입력
# 예: avatar: /assets/img/profile.png
avatar:

# SNS 또는 카카오톡 공유 시 나타나는 대표 이미지
# 예: social_preview_image: /assets/img/site-preview.png
social_preview_image:

# 게시글 목차 표시
toc: true

# ---------------------------------------------------------
# Post Actions
# ---------------------------------------------------------

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# ---------------------------------------------------------
# Comments
# ---------------------------------------------------------

# 포트폴리오 초기 단계에서는 댓글 기능 비활성화
comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang: ko
    reactions_enabled:

# ---------------------------------------------------------
# Static Assets
# ---------------------------------------------------------

assets:
  self_host:
    enabled:
    env:

# ---------------------------------------------------------
# PWA
# ---------------------------------------------------------

pwa:
  enabled: true

  cache:
    enabled: true

    deny_paths:
      # - "/example"

# ---------------------------------------------------------
# Pagination
# ---------------------------------------------------------

paginate: 8

# =========================================================
# 아래 설정은 테마의 기본 동작을 위한 영역
# 특별한 이유가 없다면 수정하지 않는 것을 권장
# =========================================================

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
